name: deploy to kunlun

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: checkout codebase
        uses: actions/checkout@v4

      - name: build images
        env:
          RUST_TARGET: ${{ secrets.RUST_TARGET }}
        run: |
          docker compose -f compose.yml -f compose.production.yml --profile production build

      - name: tag and push to registry
        run: |
          docker tag counter-server-production:latest registry.local:30500/counter-server:latest
          docker tag counter-reverse-proxy-production:latest registry.local:30500/counter-reverse-proxy:latest
          docker tag counter-cloudflared-production:latest registry.local:30500/counter-cloudflared:latest
          
          docker push registry.local:30500/counter-server:latest
          docker push registry.local:30500/counter-reverse-proxy:latest
          docker push registry.local:30500/counter-cloudflared:latest

      - name: apply secrets
        run: |
          kubectl create secret generic counter-secrets \
            --from-literal=TUNNEL_TOKEN=${{ secrets.TUNNEL_TOKEN }} \
            --from-literal=UI_PASSWORD=${{ secrets.UI_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: deploy
        run: |
          kubectl apply -f kube.production.yml
          kubectl rollout restart deployment/counter-server
          kubectl rollout restart deployment/counter-reverse-proxy
          kubectl rollout restart deployment/counter-cloudflared
