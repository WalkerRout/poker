name: deploy to homelab

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: checkout codebase
        uses: actions/checkout@v4

      - name: build image
        env:
          RUST_TARGET: ${{ secrets.RUST_TARGET }}
        run: |
          docker compose -f compose.production.yml --profile production build

      - name: tag and push to registry
        run: |
          docker tag counter-server-production:latest registry.local:30500/counter-server:latest
          docker push registry.local:30500/counter-server:latest

      - name: apply secrets
        run: |
          kubectl create secret generic counter-secrets \
            --from-literal=UI_PASSWORD=${{ secrets.UI_PASSWORD }} \
            --from-literal=DATABASE_URL=${{ secrets.DATABASE_URL }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: deploy
        run: |
          kubectl apply -f k8s/
          kubectl rollout restart deployment/counter-server
