name: deploy to kunlun

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    - name: checkout codebase
      uses: actions/checkout@v4
    
    - name: deploy counter service
      env:
        RUST_TARGET: ${{ secrets.RUST_TARGET }}
        TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
      run: |
        podman compose -f compose.yml -f compose.production.yml --profile production up -d