services:
  server-development:
    container_name: poker-server
    build:
      context: server
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    environment:
      - UI_PASSWORD=${UI_PASSWORD} # optional password; ui will not be enabled if missing
    volumes:
      - ./server/backend:/app/backend
      - ./server/service:/app/service
    networks:
      - internal
    profiles:
      - development

  reverse-proxy-development:
    container_name: poker-reverse-proxy
    build:
      context: nginx
      dockerfile: Dockerfile
    depends_on:
      - server-development
    restart: unless-stopped
    networks:
      - internal
      - external
    ports:
      - "80:80"
    profiles:
      - development

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
