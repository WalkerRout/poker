apiVersion: apps/v1
kind: Deployment
metadata:
  name: counter-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: counter-server
  template:
    metadata:
      labels:
        app: counter-server
    spec:
      containers:
        - name: counter-server
          image: registry.local:30500/counter-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: counter-secrets
                  key: DATABASE_URL
